<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Capture Creature</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    canvas { image-rendering: pixelated; }
  </style>
</head>
<body>
  <div id="error-display" style="color:red;font-size:16px;padding:20px;display:none;position:fixed;top:0;left:0;z-index:9999;background:#222;max-width:100%;word-wrap:break-word;"></div>
  <script>
    window.onerror = function(msg, src, line, col, err) {
      var el = document.getElementById('error-display');
      el.style.display = 'block';
      el.textContent = 'ERROR: ' + msg + ' at ' + src + ':' + line + ':' + col;
    };
    window.addEventListener('unhandledrejection', function(e) {
      var el = document.getElementById('error-display');
      el.style.display = 'block';
      el.textContent = 'PROMISE ERROR: ' + (e.reason ? e.reason.message || e.reason : 'unknown');
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
